<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="./img/favicon.ico" rel="icon" type="image/x-icon" />
    <link href="./css/styles.css" rel="stylesheet" type="text/css" />
    <script defer src="./js/login.js"></script>
  </head>
  <body>
    <!-- --------HEADER---------- -->
    <header class="header">
      <div></div>
      <div>
        <h3>Ejemplos - FUNDAMENTOS DE JS (ES6)</h3>
        <h4>Desarrollo WEB en entorno cliente</h4>
        <h5>Plantilla03a</h5>
      </div>
      <div>
        <img class="img" src="./img/foto.jpg" alt="foto" />
      </div>
    </header>

    <!-- ---------MENU----------- -->
    <nav class="topnav">
      <a href="https://www.w3schools.com/js/default.asp">w3schools</a>
      <a href="https://es.javascript.info/js">javascript.info</a>
      <a href="https://developer.mozilla.org/es/docs/Web/JavaScript">MDN</a>
      <a href="https://github.com/AdrianBuenoCuevas/Adrian-Bueno-Cuevas">GitHub</a>
    
    </nav>

    <br />

    <!-- ------LOGIN-FORM------ -->
    <section class="card" id="loginCard">
      <h2>Iniciar Sesión</h2>
      <form id="loginForm">
        <label for="username">Nombre de usuario:</label>
        <input type="text" id="username" name="username" required pattern="[A-Za-z]{3,}" placeholder="adrian"/>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required placeholder="dejame"/>
        <input type="submit" id="loginButton" value="Ingresar" />
        <input type="submit" id="cancelButton" value="Cancelar" />
      </form>
      <p id="loginMessage"></p> <!-- Mensaje de error o bienvenida -->
    </section>

    <!-- ---------FOOTER----------- -->
    <footer class="footer">
      © Adrián Bueno Cuevas ☺
    </footer>
  </body>
</html>
